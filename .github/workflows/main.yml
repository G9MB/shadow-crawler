name: Ppomppu Coupon Sniper

on:
  workflow_dispatch:
  schedule:
    # 🎯 한국 시간 기준 아침 7시 ~ 밤 12시(24시)까지만 0분, 30분에 실행합니다.
    # (UTC 기준 0시~15시, 그리고 22시, 23시 지정으로 한국 새벽 시간대 완벽 차단)
    - cron: '0,30 0-15,22,23 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest

    # 깃허브 액션이 실행된 후 파일(sent_posts.txt)을 다시 내 저장소에 쓰기(Write) 위한 권한 설정
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Crawler
      env:
        # 깃허브 금고(Secrets)에 저장된 토큰과 ID를 파이썬 코드 시스템 환경변수로 주입
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python crawler.py

    # 🎯 중복 발송 방지용 파일(sent_posts.txt)의 변경 사항을 깃허브 서버에 자동 백업(Commit & Push)
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_posts.txt || true
        git commit -m "Log: Update sent posts list [skip ci]" || true
        git push origin main || true
